# Pings /livez so the free Render web service never hits its 15-minute idle
# spin-down. Deployed to a PUBLIC companion repo on purpose: GitHub bills
# Actions minutes per job on private repos and the free 2,000 minutes cannot
# carry a 5-minute schedule (8,928 runs a month, each billed as a whole minute).
# Public repos are unlimited, so this costs nothing and needs no account
# anywhere else.
#
# Nothing here is secret - it is one hostname and one curl. The site is public
# anyway.
name: keepalive

on:
  # Two schedules, two minutes apart, same job. GitHub's scheduler is
  # best-effort and drifts 5-15 minutes under load; Render sleeps at 15 idle
  # minutes, so a single late cron is enough to lose the service. Two
  # independent schedules make a gap that long need both to be late at once.
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: wake and confirm
        env:
          URL: https://cookietrove.onrender.com
        run: |
          # Six tries, twenty seconds apart. A sleeping free instance needs
          # ~50 s to cold-start, so two or three of these are spent waiting for
          # a 200 that is coming. Only a run that never sees a 200 fails.
          for attempt in 1 2 3 4 5 6; do
            started=$(date +%s)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/livez" || true)
            took=$(( $(date +%s) - started ))
            echo "attempt $attempt -> ${code:-none} in ${took}s"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::no 200 from $URL/livez after 6 attempts"
          exit 1

      - name: note the schedule
        if: always()
        run: |
          echo "GitHub also disables scheduled workflows in public repos after 60"
          echo "days with no repository activity. If this repo ever goes quiet for"
          echo "two months, press Run workflow once and the schedule resumes."
